# Selector (bias-test) sweep over the three encoder families on Movie Reviews.
#
#   forge grid --file utils/grid_movie_rationales.yaml
globals:
  - "runtime.grid=true"
  - "data.dataset=movie_rationales"
  - "runtime.data.batch_size=16"
  # Capped (default is 24) to leave headroom for the tagger grid running
  # concurrently on the same machine -- at 24 threads the main grid was
  # saturating ~23/32 cores and starving the tagger runs to a crawl.
  - "runtime.threads=16"
  # Numerically equivalent (operator fusion, not an approximation).
  - "runtime.compile=true"
  # Lets re-running this grid resume gracefully: SelectorTrainer.train()
  # resumes from the latest checkpoint across the experiment's runs when
  # continue=true (or just re-runs final_eval if a run already finished all
  # its epochs), so an interrupted grid can be re-launched as-is.
  - "train.continue=true"
product:
  data.encoder.family: [sbert, e5, llm]
