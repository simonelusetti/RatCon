# NER MLP probe sweep (downstream validation) -- one probe per token encoder.
#
#   forge -M ner_probe grid --file utils/grid_ner.yaml runtime.device=cuda
#
# The -M flag is what selects ner_probe.py over train.py -- forge grid files
# carry config overrides only, not the entry point.
#
# data.encoder.pooling is deliberately NOT swept here. The probe classifies
# word-level token embeddings (gather_word_level over token_embeddings) and
# never calls pool() or pool_full(), so pooling cannot change its result --
# sweeping it would only mint signature-distinct experiments that recompute
# the same numbers. Leave it at the config default for every probe run, and
# read one probe per *token encoder*, not per (encoder, pooling) pair.
#
# conll2003 is omitted: it does not load under the pinned datasets==4.0.0
# (script-based dataset, support removed). See README "Known issues".
globals:
  # Load-bearing, not cosmetic: forge derives the experiment signature from
  # the config alone, so with no config-level difference a probe run and a
  # selector run over the same dataset/encoder would hash to the *same*
  # experiment and pile incompatible artifacts into one directory.
  # ner_probe.py never reads cfg.task; this exists purely to keep the two
  # families of experiment distinct.
  - "task=ner"
  - "runtime.grid=true"
  - "runtime.threads=16"
  - "runtime.data.batch_size=16"
  - "data.dataset=wikiann"
  # Lets re-running this grid resume gracefully: NERTrainer.train() resumes
  # from the latest checkpoint among this experiment's same-seed runs when
  # continue=true (or just re-runs final_eval if a run already finished all
  # its epochs), so an interrupted grid can be re-launched as-is.
  - "train.continue=true"
product:
  data.encoder.family: [bert, sbert, e5, llm]
  runtime.seed: [0, 1, 2]
